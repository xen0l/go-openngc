name: Mutation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gooze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --diff needs the base branch history

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # gooze needs Go 1.27.3 to build. setup-go sets GOTOOLCHAIN=local, so pick
      # the toolchain for this one command; the tests still run on Go 1.26.
      - name: Install gooze
        run: GOTOOLCHAIN=go1.27.3 go install gooze.dev/pkg/gooze@v1.3.0

      # Pull requests: mutate only the changed lines, report only.
      # The generated catalog is skipped.
      - name: Mutation testing (changed lines)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: gooze run -x '_generated\.go$' --diff "origin/$BASE_REF" ./...

      # Run the workflow by hand to mutate the whole module.
      - name: Mutation testing (whole module)
        if: github.event_name == 'workflow_dispatch'
        run: |
          gooze run -p 2 -x '_generated\.go$' ./...
          gooze report view
